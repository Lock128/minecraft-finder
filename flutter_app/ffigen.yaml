# ffigen configuration for the native Cubiomes FFI shim.
#
# Generates the Dart bindings for the flat C API declared in
# native/cubiomes/mc_finder_ffi.h into
# lib/models/worldgen/mc_finder_bindings.dart.
#
# Regenerate with:  dart run ffigen --config ffigen.yaml
#
# The generated file is a checked-in artifact. If libclang is unavailable in a
# given environment, the committed bindings in mc_finder_bindings.dart are
# hand-maintained to match this header exactly.
name: McFinderBindings
description: >-
  Dart FFI bindings for the vendored Cubiomes flat shim (mcf_find_structures,
  mcf_find_ores, mcf_get_biome).
output: 'lib/models/worldgen/mc_finder_bindings.dart'
headers:
  entry-points:
    - 'native/cubiomes/mc_finder_ffi.h'
  include-directives:
    - 'native/cubiomes/mc_finder_ffi.h'
functions:
  include:
    - 'mcf_.*'
structs:
  include:
    - 'Mcf.*'
preamble: |
  // GENERATED CODE - DO NOT MODIFY BY HAND (regenerate with ffigen).
  // ignore_for_file: always_specify_types, camel_case_types
  // ignore_for_file: non_constant_identifier_names, lines_longer_than_80_chars
comments:
  style: any
  length: full
