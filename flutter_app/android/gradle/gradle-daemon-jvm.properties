# Run the Gradle daemon (and therefore Android lint) on Java 21.
# AGP 9.x lint needs Java 21 APIs (e.g. List.removeLast()); on Java 17 it crashes
# with NoSuchMethodError. This file takes precedence over JAVA_HOME and
# org.gradle.java.home, which on Codemagic otherwise forces zulu-17.
# Gradle picks a matching JDK from locally detected installations.
toolchainVersion=21
